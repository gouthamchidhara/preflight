name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: golden manifest is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('golden/manifest.json','utf8'))"

  probe-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe.ps1 parses under Windows PowerShell 5.1
        shell: powershell
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\probe\probe.ps1", [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs | ForEach-Object { Write-Error "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          'probe.ps1 parses OK'
